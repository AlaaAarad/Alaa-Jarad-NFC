<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10271f">
  <meta name="description" content="Digital business card for Alaa Jarad, Youth Program Senior Officer at Ruwwad.">
  <title>Alaa Jarad | Digital Contact Card</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0a1c16; --panel:#122c23; --panel2:#19392d;
      --green:#91aa82; --green-light:#c2d2ad; --text:#f4f2e9;
      --muted:#b4c0b3; --line:rgba(160,185,137,.28);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:28px 18px; display:grid; place-items:center;
      background:radial-gradient(ellipse at 50% 0%,rgba(66,104,76,.34),transparent 58%),
        linear-gradient(145deg,#07130f,var(--bg) 55%,#10271f);
      color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card {
      width:min(100%,450px); overflow:hidden; border:1px solid var(--line); border-radius:28px;
      background:linear-gradient(155deg,rgba(25,57,45,.98),rgba(12,31,24,.99));
      box-shadow:0 28px 90px rgba(0,0,0,.46);
    }
    .topline { height:4px; background:linear-gradient(90deg,transparent,var(--green),transparent); }
    .inner { padding:35px 28px 27px; text-align:center; }
    .profile-photo {
      display:block;width:116px;height:116px;margin:0 auto 21px;border-radius:50%;
      object-fit:cover;object-position:center 35%;
      border:2px solid rgba(174,197,151,.78);
      box-shadow:0 0 0 7px rgba(160,185,137,.08),0 12px 35px rgba(0,0,0,.28);
    }
    .eyebrow { color:var(--green-light);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase; }
    h1 { margin:12px 0 10px;font:500 clamp(30px,7vw,37px)/1.12 Georgia,"Times New Roman",serif; }
    .role { max-width:320px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55; }
    .organization { color:var(--green-light);font-weight:650; }
    .rule { width:55px;height:1px;background:var(--green);opacity:.8;margin:25px auto 23px; }
    .actions { display:grid;grid-template-columns:1fr 1fr;gap:11px; }
    .action {
      min-height:59px;padding:13px 12px;border:1px solid rgba(160,185,137,.23);border-radius:14px;
      background:rgba(255,255,255,.035);color:var(--text);display:flex;align-items:center;justify-content:center;
      gap:10px;text-decoration:none;font-size:13px;font-weight:650;transition:.2s ease;
    }
    .action:hover,.action:focus-visible { outline:none;border-color:var(--green);background:rgba(160,185,137,.10);transform:translateY(-1px); }
    .action.primary { grid-column:1/-1;color:#102018;border-color:transparent;background:linear-gradient(110deg,#d0ddbb,#9eb58c); }
    .action.primary:hover { background:#dce7cb; }
    .ico { width:18px;height:18px;flex:0 0 18px;color:var(--green-light); }
    .primary .ico { color:#14271e; }
    .note { margin:22px 0 0;color:#9aaa9d;font-size:11px;line-height:1.65; }
    footer { border-top:1px solid rgba(160,185,137,.15);padding:16px 20px;text-align:center;color:#91a294;font-size:10px;letter-spacing:1.4px;text-transform:uppercase; }
    @media(max-width:360px) { .inner{padding:28px 19px 22px}.action{font-size:12px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{transition:none!important} }
  </style>
</head>
<body>
  <main class="card" aria-label="Digital business card">
    <div class="topline"></div>
    <section class="inner">
      <img class="profile-photo" src="Alaa-Jarad-Profile.jpg" alt="Alaa Jarad profile photo">
      <div class="eyebrow">Digital Contact Card</div>
      <h1>Alaa Jarad</h1>
      <p class="role">Youth Program Senior Officer<br><span class="organization">at Ruwwad</span></p>
      <div class="rule"></div>
      <nav class="actions" aria-label="Contact options">
        <a class="action primary" href="Alaa-Jarad.vcf" download>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>
          Save Contact
        </a>
        <a class="action" href="tel:+962799141388">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 6c0-1 1-2 2-2Z"/></svg>
          Call
        </a>
        <a class="action" href="https://wa.me/962799141388" target="_blank" rel="noopener noreferrer">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/><path d="M9 8.5c.4 2 2 3.6 4 4l1-1 2 1c-.4 1.5-1.5 2-2.5 2-3.2-.8-5.2-2.8-6-6 0-1 .5-2.1 2-2.5l1 2-1.5 1.5Z"/></svg>
          WhatsApp
        </a>
        <a class="action" href="mailto:alaa.jarad@ruwwad.jo">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          Email
        </a>
        <a class="action" href="https://www.linkedin.com/in/alaa-jarad-pmd-34833b11a/" target="_blank" rel="noopener noreferrer">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 9v10M5 5v.01M10 19v-6a3 3 0 0 1 6 0v6M10 10v9M3 3h18v18H3z"/></svg>
          LinkedIn
        </a>
      </nav>
      <p class="note">A simple way to connect. Save my contact or choose your preferred way to reach me.</p>
    </section>
    <footer>Thank you for connecting</footer>
  </main>
</body>
</html>
